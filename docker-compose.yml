# Local/prod-like single-container run. Build context is the repo root
# because the Dockerfile copies from both backend/ and frontend/.
#   docker compose up --build
services:
  app:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      # Optional -- copy backend/.env.example to .env at the repo root to
      # enable Safe Browsing / VirusTotal / Gemini. Absent by default so
      # `docker compose up` works with zero setup.
      - path: .env
        required: false
    environment:
      - PHISH_DATABASE_URL=sqlite:////data/phishing.db
    volumes:
      - phishing-data:/data

volumes:
  phishing-data:
