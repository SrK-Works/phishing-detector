name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint (non-blocking)
        run: ruff check app tests
        continue-on-error: true

      - name: Run tests
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -e ".[dev]"

      - name: Cache trained model
        id: model-cache
        uses: actions/cache@v4
        with:
          path: backend/app/model/artifacts
          key: model-${{ hashFiles('backend/app/data/dataset.parquet', 'backend/app/model/train.py') }}

      - name: Train model
        if: steps.model-cache.outputs.cache-hit != 'true'
        working-directory: backend
        run: python -m app.model.train --dataset app/data/dataset.parquet

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        working-directory: frontend
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -f backend/Dockerfile -t phishing-detector:ci .

      - name: Smoke test container
        run: |
          docker run -d --name phishing-detector-ci -p 8000:8000 phishing-detector:ci
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8000/api/stats > /dev/null; then break; fi
            sleep 1
          done
          curl -sf http://127.0.0.1:8000/api/stats
          echo
          curl -sf -X POST http://127.0.0.1:8000/api/check \
            -H "Content-Type: application/json" \
            -d '{"url":"https://www.google.com"}'

      - name: Container logs
        if: always()
        run: docker logs phishing-detector-ci

      - name: Stop container
        if: always()
        run: docker rm -f phishing-detector-ci || true
